name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Create test environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e . pytest ruff pyright

      - name: Verify source
        run: |
          .venv/bin/python -m pytest -q
          .venv/bin/python -m ruff check .
          .venv/bin/pyright

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(.venv/bin/python -c "from retrofetch import __version__; print(__version__)")
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Release tag $GITHUB_REF_NAME does not match Retrofetch v$version."
            exit 1
          }

  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Create build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[build]"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build portable EXE and installer
        shell: pwsh
        run: .\packaging\build_windows.ps1 -SkipDependencyInstall

      - name: Upload Windows files
        uses: actions/upload-artifact@v4
        with:
          name: Retrofetch-Windows
          path: |
            dist/Retrofetch.exe
            dist/RetrofetchSetup.exe
          if-no-files-found: error

  build-posix:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset: Retrofetch-linux-x86_64.tar.gz
            launcher: run-retrofetch.sh
          - runner: macos-14
            asset: Retrofetch-macos-arm64.tar.gz
            launcher: Retrofetch.command
          - runner: macos-15-intel
            asset: Retrofetch-macos-x86_64.tar.gz
            launcher: Retrofetch.command
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Create build environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[build]"

      - name: Build portable app
        run: |
          .venv/bin/python -m PyInstaller --clean --noconfirm packaging/retrofetch.spec
          ./dist/Retrofetch --version
          mkdir package
          cp dist/Retrofetch package/Retrofetch
          cp packaging/run_retrofetch.sh "package/${{ matrix.launcher }}"
          chmod +x package/Retrofetch "package/${{ matrix.launcher }}"
          tar -czf "${{ matrix.asset }}" -C package .

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: Retrofetch-${{ matrix.runner }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-posix]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Retrofetch-*
          path: release
          merge-multiple: true

      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find release -maxdepth 1 -type f -print | sort)
          test ${#files[@]} -eq 5 || {
            printf 'Expected 5 release files, found %s\n' "${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          }
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

