name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[build]" pytest ruff pyright

      - name: Verify source
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pytest -q
          .\.venv\Scripts\python.exe -m ruff check .
          .\.venv\Scripts\pyright.exe

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build portable EXE and installer
        shell: pwsh
        run: .\packaging\build_windows.ps1 -SkipDependencyInstall

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Retrofetch-Windows
          path: |
            dist/Retrofetch.exe
            dist/RetrofetchSetup.exe
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (& .\dist\Retrofetch.exe --version).Split()[-1]
          if ($tag -ne "v$version") {
            throw "Release tag $tag does not match Retrofetch v$version."
          }
          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag dist/Retrofetch.exe dist/RetrofetchSetup.exe --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag dist/Retrofetch.exe dist/RetrofetchSetup.exe --repo "${{ github.repository }}" --generate-notes
          }
