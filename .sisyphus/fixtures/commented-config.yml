# retrofetch test config fixture - commented variant for ruamel round-trip verification
# This fixture mirrors config.yml.example while keeping comments for round-trip coverage.
cache_dir: ".cache"  # cache directory used by the CLI
log_file: "retrofetch.log"  # default log file
default_limit: 75  # games per console by default
region_priority:
  - USA  # prefer US releases first
  - World
  - Europe
  - Japan
exclude_keywords:
  - "(Beta)"
  - "(Proto)"
  - "(Demo)"
  - "(Sample)"
  - "(Kiosk)"
  - "(Trade Demo)"
max_concurrent_downloads: 3  # keep parallel downloads bounded
source_fallback_by_class:
  A: [archive_org, minerva_http, minerva_torrent, romsfun]
  B: [minerva_torrent, minerva_http, archive_org, romsretro]
  C: [romsfun, romsretro, archive_org]
ranking_sources_by_class:
  A: [romsfun, romsretro, archive_org]
  B: [archive_org, romsretro]
  C: [romsfun, romsretro]
